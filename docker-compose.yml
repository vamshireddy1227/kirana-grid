services:
  kirana-grid:
    build: .
    container_name: kirana-grid-core
    ports:
      - "${PORT:-4000}:4000"
    environment:
      - PORT=4000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
